[package]
name = "kernrt"
version = "0.1.0"
edition = "2024"

[dependencies]
memmap2 = "0.9.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tract-onnx = "0.22.0"
axum = { version = "0.8", optional = true }
futures-util = { version = "0.3", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros"], optional = true }
# Image input for `/infer`: JPEG/PNG/... bodies, `data:` URIs, and remote
# `http(s)` URLs. Part of `serve`, not a separate switch — a client that can
# only post an image URL must not have to know how KernRT is built.
image = { version = "0.25", optional = true }
base64 = { version = "0.22", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset"], optional = true }

[features]
# The HTTP serving layer. Off by default so an embedded build links neither
# tokio nor axum; `cargo test --features serve` runs the whole suite.
serve = [
    "dep:axum",
    "dep:tokio",
    "dep:futures-util",
    "dep:image",
    "dep:base64",
    "dep:reqwest",
]

# `serve` imports `kernrt::serve`, which only exists under the feature.
[[example]]
name = "serve"
required-features = ["serve"]

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# Lets the serve integration tests drive the router in-process (oneshot)
# instead of binding a port. Already in the tree through axum.
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "matmul"
harness = false

[[bench]]
name = "model"
harness = false

[[bench]]
name = "microkernel"
harness = false
